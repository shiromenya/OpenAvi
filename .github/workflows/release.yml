name: Release (Windows / macOS / Linux)

on:
  push:
    tags:
      - 'v*' # 例: v0.1.0 というタグを打つと自動起動
  workflow_dispatch: # GitHub の Web 画面から手動でポチッと実行も可能
    inputs:
      version:
        description: 'Release Version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write # Releases ページにファイルをアップロードする権限

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: OpenAvi-windows-x64.zip
            binary_name: openavi.exe
          - os: macos-latest
            archive_name: OpenAvi-macos-x64.zip
            binary_name: openavi
          - os: ubuntu-latest
            archive_name: OpenAvi-linux-x64.tar.gz
            binary_name: openavi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux の依存ライブラリをインストール
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev libudev-dev

      - name: Build Release Binary
        run: cargo build --release -p au2-app

      # 配布用パッケージ（フォルダ）を作成してアセットやプラグインを同梱
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/OpenAvi" | Out-Null
          Copy-Item "target/release/openavi.exe" "dist/OpenAvi/" -Force
          Copy-Item -Recurse -Force "assets" "dist/OpenAvi/"
          Copy-Item -Recurse -Force "plugins" "dist/OpenAvi/"
          Copy-Item -Recurse -Force "samples" "dist/OpenAvi/"
          Copy-Item -Force "README.md" "dist/OpenAvi/"
          Copy-Item -Force "LICENSE" "dist/OpenAvi/"
          Compress-Archive -Path "dist/OpenAvi/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/OpenAvi
          cp target/release/openavi dist/OpenAvi/
          strip dist/OpenAvi/openavi || true
          chmod +x dist/OpenAvi/openavi
          cp -r assets plugins samples README.md LICENSE dist/OpenAvi/
          cd dist/OpenAvi && zip -r -y ../../${{ matrix.archive_name }} .

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/OpenAvi
          cp target/release/openavi dist/OpenAvi/
          strip --strip-all dist/OpenAvi/openavi || true
          chmod +x dist/OpenAvi/openavi
          cp -r assets plugins samples README.md LICENSE dist/OpenAvi/
          tar -czvf ${{ matrix.archive_name }} -C dist/OpenAvi .

      # GitHub Releases に各 OS の完成品ファイルを自動アップロード！
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
