name: Release Build (Windows x64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package OpenAvi (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Download FFmpeg (video/audio decoder to bundle)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          New-Item -ItemType Directory -Force -Path ffmpeg-bin | Out-Null
          $f = Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $p = Get-ChildItem ffmpeg-extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $f -or -not $p) { throw "ffmpeg/ffprobe not found in downloaded archive" }
          Copy-Item $f.FullName ffmpeg-bin/ffmpeg.exe
          Copy-Item $p.FullName ffmpeg-bin/ffprobe.exe
          $lic = Get-ChildItem ffmpeg-extract -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName ffmpeg-bin/FFMPEG-LICENSE.txt }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "dist/OpenAvi"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/openavi.exe" "$stage/openavi.exe"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item "ffmpeg-bin/*" "$stage/bin" -Recurse -Force
          if (Test-Path "assets") { Copy-Item "assets" "$stage/assets" -Recurse -Force }
          if (Test-Path "samples") { Copy-Item "samples" "$stage/samples" -Recurse -Force }
          if (Test-Path "plugins") { Copy-Item "plugins" "$stage/plugins" -Recurse -Force }
          if (Test-Path "install.bat") { Copy-Item "install.bat" "$stage/install.bat" }
          if (Test-Path "Launch-OpenAvi.bat") { Copy-Item "Launch-OpenAvi.bat" "$stage/Launch-OpenAvi.bat" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$stage/README.md" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$stage/LICENSE" }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/OpenAvi-windows-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAvi-windows-x64
          path: dist/OpenAvi-windows-x64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenAvi-windows-x64.zip
          generate_release_notes: true
