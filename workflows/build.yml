name: Build & Test (Multi-Platform)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub 上のボタンから手動でポチッと実行可能

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: openavi-windows-x64
            binary_path: target/release/openavi.exe
          - os: macos-latest
            artifact_name: openavi-macos-x64
            binary_path: target/release/openavi
          - os: ubuntu-latest
            artifact_name: openavi-linux-x64
            binary_path: target/release/openavi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux (Ubuntu) で GUI/音声/ダイアログに必要なライブラリをインストール
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev libudev-dev

      - name: Run Tests
        run: cargo test --workspace

      - name: Build Release Binary
        run: cargo build --release -p au2-app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
